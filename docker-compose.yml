services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: mamaksecret123
      TZ: Asia/Kuala_Lumpur
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:mamaksecret123@db:5432/postgres
      ADMIN_PIN: "1234"
      BASE_URL: http://192.168.100.36:3000
      PORT: "3000"
      TZ: Asia/Kuala_Lumpur
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: