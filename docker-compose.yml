services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/postgres
      ADMIN_PIN: ${ADMIN_PIN:?set ADMIN_PIN in .env}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      PORT: "${PORT:-3000}"
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Nightly pg_dump via scripts/backup.sh, kept 14 days — see docs/RUNBOOK.md
  # for the restore drill. postgres:16-alpine already carries pg_dump and
  # (via busybox) crond, so this needs no extra image.
  #
  # BACKUP_REMOTE_TARGET is what makes these backups survive the loss of this
  # host: without it, the live database and every backup of it sit on the same
  # machine and die together. Set it in .env (see .env.example) and mount
  # whatever credential the destination needs — never bake one into the image.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
      BACKUP_REMOTE_TARGET: ${BACKUP_REMOTE_TARGET:-}
      BACKUP_REMOTE_CMD: ${BACKUP_REMOTE_CMD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '0 3 * * * /scripts/backup.sh >>/backups/backup.log 2>&1' | crontab - &&
       crond -f -l 2"

volumes:
  dbdata:
  backups: