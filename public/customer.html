<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Order — Mamak POS</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { background:var(--cream); padding-bottom:90px; }
  
  .c-header {
    background:linear-gradient(135deg,var(--terra) 0%,var(--terra-deep) 100%);
    color:var(--white); padding:40px 24px 32px; text-align:center;
    border-radius:0 0 32px 32px; position:relative; overflow:hidden;
    box-shadow:0 10px 40px rgba(196,101,74,.25);
  }
  .c-header::before {
    content:''; position:absolute; top:-50%; right:-20%; width:300px; height:300px;
    background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);
    border-radius:50%;
  }
  .c-header h1 {
    font-family:'Playfair Display',serif; font-size:32px; font-weight:700;
    margin-bottom:8px; position:relative; z-index:1;
  }
  .c-header p { opacity:.9; font-size:15px; font-weight:300; position:relative; z-index:1; }
  
  .c-wrap { max-width:680px; margin:0 auto; padding:24px 20px; }
  
  .menu-cats {
    position:sticky; top:0; z-index:30; background:var(--cream);
    padding:16px 0; margin:0 -20px; padding-left:20px; padding-right:20px;
    display:flex; gap:10px; overflow-x:auto; scrollbar-width:none;
  }
  .menu-cats::-webkit-scrollbar { display:none; }
  .menu-cats button {
    padding:12px 20px; border:2px solid var(--light-gray); background:var(--white);
    border-radius:30px; font-size:14px; font-weight:600; color:var(--warm-gray);
    white-space:nowrap; transition:all .3s var(--bounce); flex-shrink:0;
  }
  .menu-cats button:hover { border-color:var(--terra-light); color:var(--terra); transform:translateY(-2px); }
  .menu-cats button.active {
    background:var(--terra); color:var(--white); border-color:var(--terra);
    box-shadow:0 4px 15px rgba(196,101,74,.3);
  }
  
  .menu-items { display:flex; flex-direction:column; gap:14px; margin-top:8px; }
  .item-btn {
    background:var(--white); border:2px solid transparent; border-radius:var(--radius-md);
    padding:20px; display:flex; justify-content:space-between; align-items:center;
    transition:all .3s var(--bounce); box-shadow:var(--shadow-sm);
    position:relative; overflow:hidden;
  }
  .item-btn::after {
    content:'+'; position:absolute; right:20px; top:50%; transform:translateY(-50%);
    width:36px; height:36px; background:var(--terra-pale); color:var(--terra);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; transition:all .3s var(--bounce);
  }
  .item-btn:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:var(--terra-light); }
  .item-btn:hover::after { background:var(--terra); color:var(--white); transform:translateY(-50%) scale(1.1); }
  .item-btn:active { transform:scale(.97); }
  .item-btn:active::after { transform:translateY(-50%) scale(.9); }
  .item-btn .info { flex:1; padding-right:50px; }
  .item-btn .nm { font-weight:700; font-size:16px; line-height:1.4; margin-bottom:4px; }
  .item-btn .customisable { font-size:12px; color:var(--terra); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .item-btn .pr { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--terra); }
  
  #cart-bar {
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--white); border-top:1px solid var(--light-gray);
    padding:16px 24px; box-shadow:0 -10px 40px rgba(0,0,0,.1);
    animation:slideUp .4s var(--bounce) both;
  }
  #cart-bar .inner {
    max-width:680px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;
  }
  #cart-bar .summary { display:flex; flex-direction:column; }
  #cart-bar .count { font-size:13px; color:var(--warm-gray); font-weight:500; }
  #cart-bar .total { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--terra); }
  #cart-bar .btn { padding:14px 28px; font-size:15px; }
  
  @media(max-width:600px){
    .modal-bg { align-items:flex-end; padding:0; }
    .modal {
      width:100%; max-width:100%; border-radius:var(--radius-lg) var(--radius-lg) 0 0;
      max-height:85vh; animation:slideUp .4s var(--bounce) both;
    }
  }
  
  .c-success {
    text-align:center; padding:100px 24px; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(160deg,var(--terra-pale) 0%,var(--cream) 50%,var(--sand) 100%);
  }
  .c-success .icon {
    width:100px; height:100px; background:var(--sage-deep); color:var(--white);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:48px; margin-bottom:28px; box-shadow:0 10px 40px rgba(125,153,112,.3);
    animation:pulse 2s infinite;
  }
  .c-success h2 {
    font-family:'Playfair Display',serif; font-size:32px; color:var(--charcoal);
    margin-bottom:12px;
  }
  .c-success p { color:var(--warm-gray); line-height:1.7; font-size:16px; max-width:400px; }
  .c-success .btn { margin-top:32px; padding:16px 36px; font-size:16px; }
  
  #loading {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; color:var(--warm-gray);
  }
  #loading::after {
    content:''; width:40px; height:40px; border:3px solid var(--light-gray);
    border-top-color:var(--terra); border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  
  .remark-presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .remark-presets button { padding:8px 14px; font-size:12px; }
</style>
</head>
<body>

<div id="loading">Loading menu…</div>

<div id="app" style="display:none">
  <div class="c-header">
    <h1 id="table-name"></h1>
    <p>Scan &amp; Order · No app needed</p>
  </div>
  <div class="c-wrap">
    <div id="menu-cats" class="menu-cats"></div>
    <div id="menu-items" class="menu-items"></div>
  </div>
  
  <div id="cart-bar" style="display:none">
    <div class="inner">
      <div class="summary">
        <span class="count"><b id="bar-count">0</b> items</span>
        <span class="total" id="bar-total">RM 0.00</span>
      </div>
      <button class="btn" onclick="showCart()">View Order</button>
    </div>
  </div>
</div>

<div id="cart-modal" class="modal-bg" onclick="if(event.target===this)closeCartModal()">
  <div class="modal">
    <h3>Your Order</h3>
    <div id="cart-lines"></div>
    <div id="cart-empty" class="empty">Your cart is empty</div>
    <div class="totals" id="cart-totals" style="display:none">
      <div class="row grand"><span>Total</span><span id="cart-total-rm"></span></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px">
      <button class="btn outline" style="flex:1" onclick="closeCartModal()">Keep Browsing</button>
      <button class="btn" style="flex:1" id="submit-btn" onclick="submitOrder()">Place Order</button>
    </div>
  </div>
</div>

<div id="success-view" class="view" style="display:none">
  <div class="c-success">
    <div class="icon">✓</div>
    <h2>Order Placed!</h2>
    <p>Your order has been sent to the kitchen.<br>A staff member will bring it to your table shortly.</p>
    <button class="btn" onclick="location.reload()">Order More</button>
  </div>
</div>

<div id="kandar-modal" class="modal-bg" onclick="if(event.target===this)closeKandar()">
  <div class="modal">
    <h3 id="km-title"></h3>
    <div id="km-body"></div>
    <div style="margin-top:16px">
      <label style="font-size:12px;color:var(--warm-gray);text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:block;margin-bottom:8px">Remark (optional)</label>
      <input type="text" id="km-remark" class="remark-input" placeholder="e.g. kurang pedas, no onion">
      <div class="remark-presets" id="km-presets"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px">
      <button class="btn outline" style="flex:1" onclick="closeKandar()">Cancel</button>
      <button class="btn" style="flex:1" onclick="confirmKandar()">Add to Order</button>
    </div>
  </div>
</div>

<div id="remark-modal" class="modal-bg" onclick="if(event.target===this)closeRemarkModal()">
  <div class="modal">
    <h3 id="rm-title"></h3>
    <input type="text" id="rm-input" class="remark-input" placeholder="e.g. kurang manis, less ice">
    <div class="remark-presets" id="rm-presets"></div>
    <div style="display:flex;gap:10px;margin-top:24px">
      <button class="btn outline" style="flex:1" onclick="skipRemark()">Skip</button>
      <button class="btn" style="flex:1" onclick="confirmRemark()">Add</button>
    </div>
  </div>
</div>

<script src="/api.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>'RM '+Number(n).toFixed(2);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let menu={categories:[],items:[],modifier_groups:[],modifier_options:[]};
let tableToken=null, tableName='', tableId=null;
let cart=[];
let activeCat=null;
let kandarItem=null;
let pendingItem=null;

async function init(){
  const parts=window.location.pathname.split('/');
  tableToken=parts[parts.length-1];
  if(!tableToken||tableToken==='customer.html'){
    $('loading').innerHTML='<div style="color:var(--terra);font-weight:600">Invalid QR code</div><div>Please scan the QR at your table</div>';
    return;
  }
  try{
    const tInfo=await fetch('/api/t/'+tableToken).then(r=>r.json());
    if(tInfo.error){ $('loading').innerHTML='<div style="color:var(--terra);font-weight:600">Invalid table</div><div>Please ask staff for help</div>'; return; }
    tableName=tInfo.table.name; tableId=tInfo.table.id;
    $('table-name').textContent=tableName;

    menu=await fetch('/api/menu').then(r=>r.json());
    activeCat=menu.categories[0]?.id;
    $('loading').style.display='none';
    $('app').style.display='';
    renderCats(); renderItems(); updateBar();
  }catch(e){ $('loading').innerHTML='<div style="color:var(--terra);font-weight:600">Failed to load</div><div>Check your connection and refresh</div>'; }
}

function renderCats(){
  $('menu-cats').innerHTML=menu.categories.map(c=>
    `<button class="${c.id===activeCat?'active':''}" onclick="activeCat=${c.id};renderCats();renderItems()">${esc(c.name)}</button>`
  ).join('');
}

function renderItems(){
  const items=menu.items.filter(i=>i.category_id===activeCat);
  $('menu-items').innerHTML=items.map(it=>
    `<button class="item-btn" onclick="addItem(${it.id})">
      <div class="info">
        <div class="nm">${esc(it.name)}</div>
        ${it.kandar?'<div class="customisable">Customisable</div>':''}
      </div>
      <div class="pr">${fmt(it.price)}</div>
    </button>`
  ).join('')||'<div class="empty">No items in this category</div>';
}

function addItem(id){
  const it=menu.items.find(i=>i.id===id);
  if(!it) return;
  if(it.kandar){ openKandar(it); return; }

  const cat = menu.categories.find(c => c.id === it.category_id);
  const catName = cat ? cat.name.toLowerCase() : '';
  let presets = [];
  
  if(catName.includes('minuman') || catName.includes('drink')){
    presets = ['Kurang manis', 'Less ice', 'No ice', 'Extra hot', 'Kurang kurang'];
  } else {
    presets = ['Kurang pedas', 'No onion', 'Extra spicy', 'No MSG', 'Kurang minyak'];
  }
  
  pendingItem = it;
  $('rm-title').textContent = it.name;
  $('rm-presets').innerHTML = presets.map(p => 
    `<button class="btn small outline" onclick="document.getElementById('rm-input').value='${p}'">${p}</button>`
  ).join('');
  $('rm-input').value = '';
  $('remark-modal').classList.add('show');
  setTimeout(()=>$('rm-input').focus(), 100);
}

function skipRemark(){
  if(pendingItem){
    const ex=cart.find(l=>l.item_id===pendingItem.id&&!l.mods.length&&!l.note);
    if(ex)ex.qty++; else cart.push({item_id:pendingItem.id,name:pendingItem.name,price:pendingItem.price,qty:1,mods:[],note:''});
    pendingItem=null;
  }
  closeRemarkModal(); updateBar();
}

function confirmRemark(){
  if(pendingItem){
    const note=$('rm-input').value.trim();
    const ex=cart.find(l=>l.item_id===pendingItem.id&&!l.mods.length&&l.note===note);
    if(ex)ex.qty++; else cart.push({item_id:pendingItem.id,name:pendingItem.name,price:pendingItem.price,qty:1,mods:[],note});
    pendingItem=null;
  }
  closeRemarkModal(); updateBar();
}

function closeRemarkModal(){ $('remark-modal').classList.remove('show'); pendingItem=null; }

function openKandar(it){
  kandarItem=it;
  $('km-title').textContent=it.name+' — '+fmt(it.price);
  const kuahG=menu.modifier_groups.find(g=>g.mode==='radio');
  const extraG=menu.modifier_groups.find(g=>g.mode==='checkbox');
  const kuahOpts=menu.modifier_options.filter(o=>o.group_id===kuahG?.id);
  const extraOpts=menu.modifier_options.filter(o=>o.group_id===extraG?.id);
  let html='';
  if(kuahOpts.length){
    html+=`<div style="font-size:12px;color:var(--warm-gray);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:10px">Kuah</div>`;
    html+=kuahOpts.map((o,i)=>`<div class="mod-opt"><input type="radio" name="ckuah" value="${o.id}" ${i===0?'checked':''}><span>${esc(o.name)}</span></div>`).join('');
  }
  if(extraOpts.length){
    html+=`<div style="font-size:12px;color:var(--warm-gray);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:18px 0 10px">Extra Lauk</div>`;
    html+=extraOpts.map(o=>`<div class="mod-opt"><input type="checkbox" name="cextra" value="${o.id}" data-price="${o.price}"><span style="flex:1">${esc(o.name)}</span><span style="color:var(--terra);font-weight:700">+${fmt(o.price)}</span></div>`).join('');
  }
  $('km-body').innerHTML=html;
  $('km-remark').value='';
  
  const presets = ['Kurang pedas', 'No onion', 'Extra spicy', 'Kurang minyak', 'Banjir sikit'];
  $('km-presets').innerHTML = presets.map(p => 
    `<button class="btn small outline" onclick="document.getElementById('km-remark').value='${p}'">${p}</button>`
  ).join('');
  
  $('kandar-modal').classList.add('show');
}

function closeKandar(){ $('kandar-modal').classList.remove('show'); kandarItem=null; }

function confirmKandar(){
  if(!kandarItem)return;
  const mods=[];
  const kId=document.querySelector('input[name="ckuah"]:checked')?.value;
  if(kId){const o=menu.modifier_options.find(x=>x.id==kId);if(o)mods.push({name:o.name,price:o.price});}
  document.querySelectorAll('input[name="cextra"]:checked').forEach(c=>{
    const o=menu.modifier_options.find(x=>x.id==c.value);if(o)mods.push({name:o.name,price:o.price});
  });
  const note=$('km-remark').value.trim();
  cart.push({item_id:kandarItem.id,name:kandarItem.name,price:kandarItem.price,qty:1,mods,note});
  closeKandar(); updateBar();
}

function updateBar(){
  const count=cart.reduce((s,l)=>s+l.qty,0);
  const total=cart.reduce((s,l)=>s+(l.price+l.mods.reduce((a,m)=>a+m.price,0))*l.qty,0);
  $('bar-count').textContent=count;
  $('bar-total').textContent=fmt(total);
  $('cart-bar').style.display=count?'':'none';
}

function showCart(){
  if(!cart.length){$('cart-lines').innerHTML='';$('cart-empty').style.display='';$('cart-totals').style.display='none';}
  else{
    $('cart-empty').style.display='none';$('cart-totals').style.display='';
    let total=0;
    $('cart-lines').innerHTML=cart.map((l,i)=>{
      const lt=(l.price+l.mods.reduce((s,m)=>s+m.price,0))*l.qty;total+=lt;
      const ms=l.mods.map(m=>m.name+(m.price?` +${fmt(m.price)}`:'')).join(', ');
      return `<div class="cart-line"><div><b>${l.qty}×</b> ${esc(l.name)}${ms?`<br><small style="color:var(--warm-gray)">${esc(ms)}</small>`:''}${l.note?`<br><small style="color:var(--terra)">📝 ${esc(l.note)}</small>`:''}</div>
        <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;color:var(--terra)">${fmt(lt)}</span>
          <div class="qty"><button onclick="cq(${i},-1)">−</button><button onclick="cq(${i},1)">+</button><button onclick="cd(${i})" style="color:var(--red)">✕</button></div>
        </div></div>`;
    }).join('');
    $('cart-total-rm').textContent=fmt(total);
  }
  $('cart-modal').classList.add('show');
}

function closeCartModal(){$('cart-modal').classList.remove('show');}
function cq(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);updateBar();showCart();}
function cd(i){cart.splice(i,1);updateBar();showCart();}

async function submitOrder(){
  if(!cart.length)return;
  $('submit-btn').disabled=true;$('submit-btn').textContent='Sending…';
  try{
    const items=cart.map(l=>({item_id:l.item_id,qty:l.qty,note:l.note,modifier_option_ids:l.mods.map(m=>{
      const opt=menu.modifier_options.find(o=>o.name===m.name);return opt?opt.id:null;
    }).filter(Boolean)}));
    await fetch('/api/public/orders',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({table_token:tableToken,items})});
    $('cart-modal').classList.remove('show');
    $('app').style.display='none';$('cart-bar').style.display='none';
    $('success-view').style.display='';
  }catch(e){alert('Failed to place order. Please try again or ask staff.');$('submit-btn').disabled=false;$('submit-btn').textContent='Place Order';}
}

init();
</script>
</body>
</html>
