<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Pinch-zoom stays available: it is an accessibility control, and the page
     is built not to need it. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Order — Mamak POS</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding-bottom:96px; }

  /* Sticky, one-row, horizontally scrolling category tabs — same rules as the
     staff till (master spec §37): no wrapping, ≥44px targets, active tab
     scrolled into view. */
  #menu-cats {
    position:sticky; top:0; z-index:30; background:var(--cream);
    padding:12px 0; margin:0 -16px 4px; padding-left:16px; padding-right:16px;
  }

  .menu-items { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .item-btn {
    flex-direction:row; align-items:center; justify-content:space-between;
    padding:16px; min-height:64px; gap:12px;
  }
  .item-btn .info { flex:1; min-width:0; }
  .item-btn .nm { font-weight:700; font-size:16px; line-height:1.3; }
  .item-btn .customisable { font-size:12px; color:var(--terra-deep); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .item-btn .pr { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; color:var(--terra-deep); margin:0; flex-shrink:0; }
  .item-btn .add { font-size:22px; font-weight:800; color:var(--terra-deep); flex-shrink:0; }
</style>
</head>
<body>

<div id="loading">Loading menu…</div>

<!-- Ordering paused: a plain sentence, not a broken menu -->
<div id="paused-view" style="display:none">
  <div class="c-success">
    <div class="icon" style="background:var(--amber)">⏸</div>
    <h2>Ordering is paused</h2>
    <p id="paused-message" data-i18n="customer.paused">Online ordering is temporarily paused. Please order with our staff.</p>
  </div>
</div>

<div id="app" style="display:none">
  <div class="c-header">
    <button class="icon-btn" id="locale-toggle" data-action="toggle-locale" title="Switch language / Tukar bahasa"
            aria-label="Switch language" style="position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);color:#fff">EN</button>
    <h1 id="table-name"></h1>
    <p data-i18n="customer.subtitle">Scan &amp; Order · No app needed</p>
  </div>
  <div class="c-wrap">
    <div id="my-orders"></div>
    <div id="menu-cats" class="cat-tabs" aria-label="Menu categories"></div>
    <div id="menu-items" class="menu-items"></div>
  </div>

  <div id="cart-bar" style="display:none">
    <div class="inner">
      <div>
        <div class="count"><b id="bar-count">0</b> items</div>
        <div class="total" id="bar-total">RM 0.00</div>
      </div>
      <button class="btn primary-lg" style="width:auto" data-action="show-cart" data-i18n="customer.viewOrder">View Order</button>
    </div>
  </div>
</div>

<div id="cart-modal" class="modal-bg">
  <div class="modal">
    <h3 data-i18n="customer.yourOrder">Your Order</h3>
    <div id="cart-lines"></div>
    <div id="cart-empty" class="empty">Nothing added yet</div>
    <div class="totals" id="cart-totals" style="display:none">
      <div class="row grand"><span>Total</span><span id="cart-total-rm"></span></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-action="close-cart-modal" data-i18n="customer.keepBrowsing">Keep Browsing</button>
      <button class="btn" id="submit-btn" data-action="submit-order" data-i18n="customer.placeOrder">Place Order</button>
    </div>
  </div>
</div>

<div id="success-view" class="view" style="display:none">
  <div class="c-success">
    <div class="icon">✓</div>
    <h2 data-i18n="customer.orderSent">Order sent</h2>
    <p id="success-table"></p>
    <div id="success-steps" class="c-steps"></div>
    <div id="success-status" class="meta" style="margin:8px 0 16px"></div>
    <div id="success-items" class="c-order-summary"></div>
    <button class="btn primary-lg" style="max-width:320px" data-action="order-more" data-i18n="customer.orderMore">Order More</button>
  </div>
</div>

<div id="kandar-modal" class="modal-bg">
  <div class="modal">
    <h3 id="km-title"></h3>
    <div id="km-body"></div>
    <div style="margin-top:14px">
      <label class="label" for="km-remark">Remark (optional)</label>
      <input type="text" id="km-remark" class="remark-input" aria-label="Remark for this item" placeholder="e.g. kurang pedas, no onion">
      <div class="remark-presets" id="km-presets"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-action="close-mods">Cancel</button>
      <button class="btn" id="km-confirm-btn" data-action="confirm-mods">Add</button>
    </div>
  </div>
</div>

<div id="remark-modal" class="modal-bg">
  <div class="modal">
    <h3 id="rm-title"></h3>
    <input type="text" id="rm-input" class="remark-input" aria-label="Remark for this item" placeholder="e.g. kurang manis, less ice">
    <div class="remark-presets" id="rm-presets"></div>
    <div class="modal-actions">
      <button class="btn" data-action="skip-remark">Add</button>
      <button class="btn outline" data-action="confirm-remark">Add with remark</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/customer/customer.js"></script>
</body>
</html>
